name: Django CI/CD Pipeline

on:
  push:
    branches: [ base_develop ]
  pull_request:
    branches: [ base_develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Linter (PEP 8 check)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        env:
          SECRET_KEY: 'django-insecure-test-key-for-github-actions-automation'
          DEBUG: 'True'
        run: python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/base_develop' && github.event_name == 'push'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Prepare deploy directory
        run: |
          ssh -v -T -o StrictHostKeyChecking=no -o ConnectTimeout=15 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          mkdir -p ~/education_system
          cd ~/education_system
          
          if [ -f docker-compose.yml ]; then
              docker-compose down --remove-orphans || true
          fi
          
          find . -maxdepth 1 ! -name '.' ! -name '.env' -exec rm -rf {} +
          EOF

      - name: Generate local .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Copy project files to server
        run: |
          scp -o StrictHostKeyChecking=no .env Dockerfile docker-compose.yml nginx.conf requirements.txt pyproject.toml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/education_system/

      - name: Start Docker Application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ~/education_system
          docker-compose up --build -d
          docker-compose exec -T web python manage.py migrate
          EOF
