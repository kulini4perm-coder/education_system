name: Django CI/CD Pipeline

# Запускается при каждом push или Pull Request
on:
  push:
    branches: [ base_develop ]
  pull_request:
    branches: [ base_develop ]

jobs:
  # Тестирование и проверка PEP 8
  tests_and_linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Linter (PEP 8 check)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests
        env:  # тестовые переменные окружения
          SECRET_KEY: 'django-insecure-test-key-for-github-actions-automation'
          DEBUG: 'True'
          NAME: 'test_db'
          USER: 'postgres'
          PASSWORD: 'password'
          HOST: '127.0.0.1'
          PORT: '5432'
        run: python manage.py test

  # Деплой после успешных тестов
  deploy:
    runs-on: ubuntu-latest
    needs: tests_and_linting
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Разворачиваем проект на удаленном сервере с использованием Docker
      - name: Deploy to Yandex Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/education_system
            cd ~/education_system
            
            docker-compose down || true
            
            rm -rf *
            
            echo "${{ secrets.ENV_FILE }}" > .env
            
            cat << 'EOF' > Dockerfile
            ${{ steps.read_dockerfile.outputs.content }}
            EOF

      - name: Copy project files to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "Dockerfile,docker-compose.yml,nginx.conf,requirements.txt,pyproject.toml"
          target: "~/education_system"

      - name: Execute docker-compose build and up on remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/education_system
            
            docker-compose up --build -d
            
            docker-compose exec -T web python manage.py migrate
